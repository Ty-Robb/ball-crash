<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ball Crash</title>
<style>
  :root { --bg-top: #1b1340; --bg-bot: #3b1f6b; --accent: #ffd23f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bot));
    transition: background 0.6s;
  }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas#game:active { cursor: grabbing; }

  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 16px; pointer-events: none; text-align: center; }
  #levelbar { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .lv {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.5);
  }
  .lv.cur { background: var(--accent); color: #222; border-color: var(--accent); }
  .track { width: min(52vw, 260px); height: 12px; border-radius: 8px; background: rgba(255,255,255,0.18); overflow: hidden; }
  #prog { height: 100%; width: 0%; background: var(--accent); border-radius: 8px; transition: width 0.15s; }
  #score { font-size: 52px; font-weight: 900; margin-top: 10px; text-shadow: 0 3px 0 rgba(0,0,0,0.25); line-height: 1; }
  #best { font-size: 13px; font-weight: 700; opacity: 0.7; letter-spacing: 0.12em; margin-top: 4px; }

  #fire {
    margin: 12px auto 0; width: 170px; font-weight: 900; font-size: 15px; letter-spacing: 0.2em;
    color: #ffb347; text-shadow: 0 0 12px #ff5a00; transition: opacity 0.2s, transform 0.2s;
  }
  #fire.hidden { opacity: 0; transform: scale(0.8); }
  .fuel { height: 6px; margin-top: 5px; border-radius: 4px; background: rgba(255,255,255,0.2); overflow: hidden; }
  #fuel { height: 100%; width: 100%; background: linear-gradient(90deg, #ff3d00, #ffd23f); }

  #mute {
    position: fixed; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,0.18); color: #fff; font-size: 18px; cursor: pointer;
  }

  #popups { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop {
    position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.3); animation: rise 0.8s ease-out forwards; white-space: nowrap;
  }
  .pop.big { font-size: 30px; color: #ffb347; text-shadow: 0 0 14px #ff5a00; }
  .pop.gold { color: var(--accent); }
  @keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -70px; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10, 5, 30, 0.45);
    backdrop-filter: blur(3px); transition: opacity 0.25s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .card { text-align: center; padding: 28px 32px; max-width: 90vw; }
  .card h1 {
    margin: 0; font-size: clamp(44px, 12vw, 84px); font-weight: 900; letter-spacing: 0.02em; line-height: 0.95;
    text-shadow: 0 5px 0 rgba(0,0,0,0.3);
  }
  .card h1 .crash { color: var(--accent); }
  .card p { opacity: 0.85; font-size: 16px; line-height: 1.5; margin: 16px 0 6px; }
  #ovStats { font-size: 20px; font-weight: 800; margin: 10px 0; min-height: 1em; }
  #ovBtn {
    margin-top: 14px; padding: 15px 46px; border: 0; border-radius: 40px; font: inherit; font-size: 20px;
    font-weight: 900; letter-spacing: 0.1em; background: var(--accent); color: #222; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25); animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .keys { font-size: 13px; opacity: 0.6; margin-top: 18px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="levelbar">
    <span id="lvCur" class="lv cur">1</span>
    <div class="track"><div id="prog"></div></div>
    <span id="lvNext" class="lv">2</span>
  </div>
  <div id="score">0</div>
  <div id="best">BEST 0</div>
  <div id="fire" class="hidden">FIREBALL<div class="fuel"><div id="fuel"></div></div></div>
</div>

<div id="popups"></div>
<button id="mute" title="Toggle sound (M)">🔊</button>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">BALL<br><span class="crash">CRASH</span></h1>
    <p id="ovText">Drag to spin the tower. Drop through the gaps.<br>Avoid the glowing red spikes.<br>3 gaps in a row without bouncing = <b>FIREBALL</b>.</p>
    <div id="ovStats"></div>
    <button id="ovBtn">PLAY</button>
    <div class="keys">Mouse / touch drag &nbsp;·&nbsp; ← → or A D &nbsp;·&nbsp; M to mute</div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
